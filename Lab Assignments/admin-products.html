<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - BeDentist Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .admin-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }

        .admin-header {
            background: linear-gradient(135deg, #5ccdbe 0%, #4ab8a9 100%);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .admin-header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-logo img {
            height: 50px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #5ccdbe;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            color: #333;
        }

        .btn-add {
            padding: 12px 25px;
            background: linear-gradient(135deg, #5ccdbe, #4ab8a9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(92, 205, 190, 0.4);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-card-body {
            padding: 20px;
        }

        .product-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #333;
        }

        .product-card .category {
            display: inline-block;
            background: rgba(92, 205, 190, 0.1);
            color: #5ccdbe;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .product-card .price {
            font-size: 22px;
            font-weight: 700;
            color: #5ccdbe;
            margin-bottom: 10px;
        }

        .product-card .stock {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn-edit, .btn-delete {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-edit:hover { background: #2563eb; }
        .btn-delete:hover { background: #dc2626; }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 24px;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .modal-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #5ccdbe;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .image-upload {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .image-upload:hover {
            border-color: #5ccdbe;
            background: rgba(92, 205, 190, 0.05);
        }

        .image-upload.has-image {
            padding: 10px;
        }

        .image-upload img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        .image-upload p {
            color: #666;
            margin-top: 10px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #5ccdbe, #4ab8a9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .btn-logout {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="admin-page">
        <header class="admin-header">
            <div class="admin-header-content">
                <div class="admin-logo">
                    <img src="images/logo-tooth.png" alt="BeDentist">
                    <h1>�� Manage Products</h1>
                </div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="admin-container">
            <a href="admin.html" class="back-link">← Back to Dashboard</a>

            <div class="page-header">
                <h1>�� All Products</h1>
                <button class="btn-add" onclick="openAddModal()">
                    ➕ Add New Product
                </button>
            </div>

            <div id="productsGrid" class="products-grid">
                <div class="loading">Loading products...</div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Product</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">

                    <div class="form-group">
                        <label>Product Image *</label>
                        <div class="image-upload" id="imageUpload" onclick="document.getElementById('imageInput').click()">
                            <p>�� Click to upload image</p>
                            <p style="font-size: 12px; color: #999;">Supports JPG, PNG, WebP</p>
                        </div>
                        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                        <input type="hidden" id="imageUrl">
                    </div>

                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" required placeholder="e.g., Electric Toothbrush Pro">
                    </div>

                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="productDescription" rows="3" required placeholder="Describe your product..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Price ($) *</label>
                            <input type="number" id="productPrice" step="0.01" required placeholder="29.99">
                        </div>
                        <div class="form-group">
                            <label>Stock *</label>
                            <input type="number" id="productStock" required placeholder="50">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Category *</label>
                        <select id="productCategory" required>
                            <option value="">Select Category</option>
                            <option value="Dental Products">Dental Products</option>
                            <option value="Oral Care">Oral Care</option>
                            <option value="Whitening">Whitening</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Save Product</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let editingProduct = null;

        // Check auth
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            if (!token || !user) {
                window.location.href = 'login.html';
                return;
            }
            const userData = JSON.parse(user);
            if (userData.role !== 'admin') {
                window.location.href = 'home.html';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // Load products
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/products`);
                const data = await response.json();

                if (data.success) {
                    renderProducts(data.data);
                }
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsGrid').innerHTML = '<p>Error loading products</p>';
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');

            if (products.length === 0) {
                grid.innerHTML = '<p>No products found. Add your first product!</p>';
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
                    <div class="product-card-body">
                        <span class="category">${product.category}</span>
                        <h3>${product.name}</h3>
                        <div class="price">$${product.price.toFixed(2)}</div>
                        <div class="stock">Stock: ${product.stock} units</div>
                        <div class="product-actions">
                            <button class="btn-edit" onclick='editProduct(${JSON.stringify(product)})'>✏️ Edit</button>
                            <button class="btn-delete" onclick="deleteProduct('${product._id}')">��️ Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Modal functions
        function openAddModal() {
            editingProduct = null;
            document.getElementById('modalTitle').textContent = 'Add New Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('imageUpload').innerHTML = '<p>�� Click to upload image</p><p style="font-size: 12px; color: #999;">Supports JPG, PNG, WebP</p>';
            document.getElementById('imageUpload').classList.remove('has-image');
            document.getElementById('productModal').classList.add('active');
        }

        function editProduct(product) {
            editingProduct = product;
            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('productId').value = product._id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productDescription').value = product.description;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productStock').value = product.stock;
            document.getElementById('productCategory').value = product.category;
            document.getElementById('imageUrl').value = product.image;

            if (product.image) {
                document.getElementById('imageUpload').innerHTML = `<img src="${product.image}" alt="Product">`;
                document.getElementById('imageUpload').classList.add('has-image');
            }

            document.getElementById('productModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        // Image upload to Cloudinary
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadDiv = document.getElementById('imageUpload');
            uploadDiv.innerHTML = '<p>⏳ Uploading to Cloudinary...</p>';

            try {
                const formData = new FormData();
                formData.append('image', file);

                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('imageUrl').value = data.data.url;
                    uploadDiv.innerHTML = `<img src="${data.data.url}" alt="Uploaded">`;
                    uploadDiv.classList.add('has-image');
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                console.error('Upload error:', error);
                uploadDiv.innerHTML = '<p>❌ Upload failed. Click to try again.</p>';
                alert('Image upload failed. Please try again.');
            }
        }

        // Form submit
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const productId = document.getElementById('productId').value;
            const imageUrl = document.getElementById('imageUrl').value;

            if (!imageUrl) {
                alert('Please upload a product image');
                return;
            }

            const productData = {
                name: document.getElementById('productName').value,
                description: document.getElementById('productDescription').value,
                price: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                category: document.getElementById('productCategory').value,
                image: imageUrl
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            try {
                const token = localStorage.getItem('token');
                const url = productId ? `${API_URL}/products/${productId}` : `${API_URL}/products`;
                const method = productId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productData)
                });

                const data = await response.json();

                if (data.success) {
                    alert(productId ? 'Product updated!' : 'Product added!');
                    closeModal();
                    loadProducts();
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                console.error('Save error:', error);
                alert('Error saving product: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Product';
            }
        });

        // Delete product
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/products/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    alert('Product deleted!');
                    loadProducts();
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('Error deleting product');
            }
        }

        // Initialize
        checkAuth();
        loadProducts();
    </script>
</body>
</html>
